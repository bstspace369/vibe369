<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIBE@369</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#030712;
color:white;
line-height:1.6;
}

nav{
position:sticky;
top:0;
z-index:1000;
background:#000814;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
border-bottom:1px solid #0f172a;
}

.logo{
font-size:36px;
font-weight:700;
}

.logo span{
color:#22d3ee;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:14px;
}

.hero{
min-height:90vh;
display:flex;
align-items:center;
padding:80px 8%;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2000&q=80');
background-size:cover;
background-position:center;
}

.hero-content{
max-width:700px;
}

.hero h1{
font-size:90px;
line-height:1;
margin-bottom:20px;
}

.hero h1 span{
color:#22d3ee;
}

.hero h2{
font-size:28px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:14px 28px;
border-radius:8px;
text-decoration:none;
margin-right:15px;
font-weight:600;
}

.btn-primary{
background:#06b6d4;
color:white;
}

.btn-secondary{
border:1px solid #06b6d4;
color:white;
}

section{
padding:80px 8%;
}

.section-title{
font-size:42px;
margin-bottom:20px;
color:#22d3ee;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

.card{
background:#0f172a;
border:1px solid #1e293b;
padding:30px;
border-radius:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
margin-bottom:15px;
color:#22d3ee;
}

.card ul{
padding-left:20px;
}

.stat-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.stat{
background:#0f172a;
padding:25px;
text-align:center;
border-radius:12px;
}

.stat h2{
font-size:50px;
color:#22d3ee;
}

.locations{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.location{
background:#0f172a;
padding:20px;
text-align:center;
border-radius:10px;
}

.cta{
background:linear-gradient(135deg,#0f172a,#1e3a8a);
text-align:center;
border-radius:20px;
padding:60px;
}

footer{
text-align:center;
background:#000814;
padding:40px 20px;
}

footer p{
margin-top:10px;
color:#cbd5e1;
}
